# Local intents, checked in order; first regex match wins.
#
# Ordering + anchoring (spec "Matching precision & dispatch safety", 2026-07-15):
# timer intents come BEFORE device intents; every command pattern is anchored
# to the utterance start with an optional politeness prefix, so command
# n-grams inside questions or reminder payloads never hijack routing.
#
# action.type: timer       -> dispatched to timers.handle_timer (verb: set|cancel|query)
#              device      -> HTTP call to a device API, speak `response`
#              open_brain  -> forward the full utterance to Open Brain
# Named groups in patterns are available as {slot} in action.url.
#
# _p is the politeness/filler prefix, inlined in every pattern:
#   (?:(?:please|hey|ok|okay|um|uh)[,.]? )*
# The optional [,.]? tolerates faster-whisper punctuating filler words, e.g.
# "Okay, set a timer for 10 minutes." (comma after "Okay").

intents:
  - name: timer_set
    patterns:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:set|start) (?:a |an )?timer\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:\\w+[ -])+minute timer\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*set (?:a |an )?alarm\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*wake me(?: up)? at\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*remind me to\\b"
    action:
      type: timer
      verb: set

  - name: timer_cancel
    patterns:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*cancel\\b.*\\b(?:timer|alarm|reminder)s?\\b"
    action:
      type: timer
      verb: cancel

  - name: timer_query
    patterns:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*how long(?: is)? left\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*what (?:timer|alarm|reminder)s?\\b"
    action:
      type: timer
      verb: query

  - name: knowledge_query
    # 2026-08-10 redesign: primary trigger "open brain", secondary "check my notes/brain".
    # Each pattern captures (?P<topic>...) — the search topic — so trigger scaffolding
    # ("look for", "in my open brain") never reaches the Open Brain search query.
    # Order matters (first match wins): topic-bearing patterns before bare-trigger patterns.
    patterns:
      # topic BETWEEN verb and "open brain": "look for <topic> in/from/on my open brain"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:look for|search for|find|get)\\s+(?P<topic>.+?)\\s+(?:in|from|on)\\s+(?:my\\s+|the\\s+)?open brain\\b"
      # topic AFTER "for": "search my open brain for <topic>" / "check open brain for <topic>"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:search|check|look in|ask|search in)?\\s*(?:my\\s+|the\\s+)?open brain\\b.*?\\bfor\\s+(?P<topic>.+)"
      # topic AFTER trigger, on/about lead-in optional: "ask open brain about <topic>", "open brain, what do I have on <topic>"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:ask\\s+)?(?:my\\s+|the\\s+)?open brain\\b[,\\s]+(?:.*?\\b(?:on|about)\\b\\s+)?(?P<topic>.+)"
      # secondary: "check my/the notes/brain on/about/for <topic>"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*check (?:my|the) (?:notes|brain)\\b(?:\\s+(?:on|about|for)\\s+(?P<topic>.+))?"
      # bare triggers (no topic) — matched last so topic-bearing forms win first:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?:ask\\s+)?(?:my\\s+|the\\s+)?open brain\\s*$"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*check (?:my|the) (?:notes|brain)\\s*$"
    action:
      type: open_brain

  - name: lights_on
    patterns:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*turn (?:on|up) the (?P<room>\\w+) lights?\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?P<room>(?!the\\b|a\\b|an\\b|my\\b|our\\b)\\w+) lights? on\\b"
    action:
      type: device
      method: POST
      # TODO(will): point at the real device API (Hue bridge, Tasmota, etc.)
      url: "http://lights.local/api/{room}/on"
    response: "Okay, {room} lights on."

  - name: lights_off
    patterns:
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*turn off the (?P<room>\\w+) lights?\\b"
      - "^(?:(?:please|hey|ok|okay|um|uh)[,.]? )*(?P<room>(?!the\\b|a\\b|an\\b|my\\b|our\\b)\\w+) lights? off\\b"
    action:
      type: device
      method: POST
      url: "http://lights.local/api/{room}/off"
    response: "Okay, {room} lights off."
